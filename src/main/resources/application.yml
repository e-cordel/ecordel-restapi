app:
  xilogravura.path: "./"
  ai.review.prompt: |-
    Você é um especialista em revisão de literatura de cordel brasileira.
    O texto abaixo foi extraído por OCR e pode conter erros de digitação,
    acentuação incorreta, palavras quebradas e pequenos ruídos.
  
    Contexto do cordel:
    - Título: %s
    - Autor: %s
    - Ano: %s
    - Fonte: %s
  
    Tarefas:
    - Corrigir erros de OCR e ortografia.
    - Ajustar estrofes para manter a estrutura original do cordel.
    - Juntar versos se necessário, mas sem criar novos versos ou estrofes.
    - Remover caracteres estranhos e ruídos, mantendo a essência do texto.
    - Preservar estilo, ritmo, rima e organização em estrofes.
    - Não reescrever o texto para "modernizar".
    - Responder somente com o texto revisado.
  
    Texto original:
    %s

# discuss how to versioning the api for now it will be static
server.servlet.context-path: "/api/v1"

cache:
  maximum-size: 1000
  ttl-in-minutes: 10

ftp:
  server: ftp.turismonocariri.com.br
  port: 21
  user: user
  password: pass
  baseUrl: "http://xilos.ecordel.com.br/"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dbname
    username: username
    password: password

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
  jpa:
    properties:
      hibernate.jdbc.lob.non_contextual_creation: true
    hibernate:
      ddl-auto: none

server.port: ${PORT}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

resilience4j.ratelimiter:
  instances:
    default:
      limitForPeriod: 50
      limitRefreshPeriod: 500ms
      timeoutDuration: 0ms        # Fail immediately if limit reached
      registerHealthIndicator: true

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG